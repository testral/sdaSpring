; Konfiguracja konwertera MT940 -> WAPRO Fakir
; Ścieżki względne liczone są od katalogu, w którym leży ten plik.

[katalogi]
; tu wrzucasz (lub bankowość zapisuje) pliki MT940
wejscie = wejscie
; tu powstają pliki CSV do zaimportowania w Fakirze
wyjscie = do_fakira
; przetworzone pliki MT940
archiwum = archiwum
; pliki, których nie udało się odczytać
bledne = bledne
; log działania i rejestr przetworzonych plików
logi = logi

[wejscie]
; auto | windows-1250 | cp852 | utf-8 | iso-8859-2
kodowanie = auto
maski = *.sta;*.940;*.mt940;*.txt
; nie przetwarzaj drugi raz tego samego pliku (ochrona przed podwójnym zaksięgowaniem)
pomijaj_przetworzone = tak
; gdy saldo początkowe + obroty != saldo końcowe: tak = odrzuć plik, nie = tylko ostrzeżenie w logu
blad_przy_niezgodnym_saldzie = tak

[wyjscie]
; kodowanie, separator i formaty muszą odpowiadać definicji pliku importu w Fakirze
kodowanie = windows-1250
; ; , | lub tab
separator = ;
separator_dziesietny = ,
; %Y-%m-%d = 2026-10-27, %d.%m.%Y = 27.10.2026, %Y%m%d = 20261027
format_daty = %Y-%m-%d
; pierwszy wiersz z nazwami kolumn (w Fakirze ustaw wtedy pominięcie 1 wiersza)
naglowek = tak
max_dlugosc_tekstu = 250
; kolejność kolumn w pliku. Dostępne: rachunek, nr_wyciagu, data_wyciagu, data_operacji,
; data_waluty, kwota (ze znakiem), kwota_bez_znaku, wplyw, wyplyw, strona (WN/MA dla konta
; bankowego), znak (C/D), waluta, kontrahent, adres_kontrahenta, rachunek_kontrahenta, tytul,
; kod_operacji, opis_operacji, kod_typu, referencja, referencja_banku
kolumny = rachunek, nr_wyciagu, data_operacji, data_waluty, kwota, wplyw, wyplyw, waluta,
    kontrahent, adres_kontrahenta, rachunek_kontrahenta, tytul, kod_operacji, opis_operacji,
    referencja_banku
